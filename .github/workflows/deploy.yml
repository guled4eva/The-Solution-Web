# Publiserer nettsiden automatisk til GitHub Pages
# hver gang noe endres i main-grenen – også når noen lagrer i
# redigeringspanelet på /loggin.
#
# Engangsoppsett i GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# For innlogging på /loggin (TinaCMS) må disse ligge under
#   Settings → Secrets and variables → Actions → New repository secret:
#     TINA_PUBLIC_CLIENT_ID
#     TINA_TOKEN
# Mangler de, publiseres nettsiden som vanlig, bare uten redigeringspanelet.

name: Deploy The Solution to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TINA_PUBLIC_CLIENT_ID: ${{ secrets.TINA_PUBLIC_CLIENT_ID }}
      TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: Bygg redigeringspanelet (/loggin)
        if: ${{ env.TINA_PUBLIC_CLIENT_ID != '' && env.TINA_TOKEN != '' }}
        run: npx tinacms build --noTelemetry

      - name: Bygg nettsiden
        run: npm run build

      - name: Konfigurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Last opp nettsiden
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
