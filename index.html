    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="stylesheet"
    />
    <script>
      // After a new version is published, a browser may still hold the old page that points to
      // JavaScript files that no longer exist (blank page). Reload once to fetch the new version.
      window.addEventListener(
        "error",
        function (e) {
          var t = e.target;
          if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
          try {
            var last = Number(sessionStorage.getItem("ts-reloaded") || 0);
            if (Date.now() - last < 30000) return;
            sessionStorage.setItem("ts-reloaded", String(Date.now()));
          } catch (err) {
            return;
          }
          location.reload();
        },
        true
      );
    </script>
